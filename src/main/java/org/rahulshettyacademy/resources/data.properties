# ========================================
# Appium Server Configuration
# ========================================
ipAddress=127.0.0.1
port=4723

# ========================================
# Appium Server JS Path (Mac)
# Mac: /Users/nhz/.npm-global/lib/node_modules/appium/build/lib/main.js
# Windows: C:\\Users\\nhz\\AppData\\Roaming\\npm\\node_modules\\appium\\build\\lib\\main.js
# ========================================
#appiumServerPath=/Users/nhz/.npm-global/lib/node_modules/appium/build/lib/main.js
appiumServerPath=C:/Users/nhz/AppData/Roaming/npm/node_modules/appium/build/lib/main.js
# ========================================
# Device Configuration
# ========================================
AndroidDeviceName=SM-M356B
# Other devices: Google Pixel 8a, Vivo I2404, RZCT90QMT3Y (serial)

# ========================================
# App Configuration (App Already Installed)
# ========================================
# Package name from: adb shell pm list packages | grep dogpack
appPackage=com.dogpack

# Main activity from: adb shell dumpsys window | grep mFocusedApp
appActivity=com.dogpack.MainActivity

# ========================================
# APK Path (BACKUP - if you ever need fresh install)
# Set useApk=true to install fresh APK instead of using installed app
# ========================================
useApk=false
apkRelativePath=src/test/java/org/dogpack/resources/DogpackInfra.apk

# ========================================
# Reset Behavior
# ========================================
# noReset=false -> Clear app data before each test (fresh login state)
# noReset=true  -> Keep app data (faster but may have stale state)
noReset=false

# ========================================
# Browser (for hybrid apps)
# ========================================
browser=chrome

# ========================================
# Manual Appium Start Command (Reference)
# Run in terminal before tests:
# appium --allow-insecure=chromedriver_autodownload
# ========================================